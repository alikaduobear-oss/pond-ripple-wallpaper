<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 只加载本地脚本与内联样式，其余一律禁止：消除 Electron 的 CSP 安全告警 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
  <title>Pond Ripple Wallpaper</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    /* 水面画布铺满整屏；平静时完全透明，只有涟漪区域可见 */
    #water-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="water-canvas"></canvas>
  <script src="js/water.js?v=1"></script>
  <script src="js/boot.js?v=1"></script>
</body>
</html>
